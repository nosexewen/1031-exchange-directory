name: Bootstrap remote directory
on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: New repository name under the token owner
        required: true
        default: 1031-exchange-directory
        type: string
permissions:
  contents: read
concurrency:
  group: bootstrap-1031-directory
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.DIRECTORY_BOOTSTRAP_TOKEN }}
      TARGET_NAME: ${{ inputs.repository_name }}
      PUBLIC_SITE_URL: https://1031-exchange-directory.pages.dev
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve remote account and refuse overwrite
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if [[ ! "$TARGET_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]]; then
            echo "Invalid repository name"
            exit 1
          fi
          TARGET_OWNER="$(gh api user --jq .login)"
          if [[ "${TARGET_OWNER,,}" != "${GITHUB_REPOSITORY_OWNER,,}" ]]; then
            echo "Run bootstrap in a repository owned by the same account as the token"
            exit 1
          fi
          echo "TARGET_OWNER=$TARGET_OWNER" >> "$GITHUB_ENV"
          if gh api "repos/$TARGET_OWNER/$TARGET_NAME" > /dev/null 2>&1; then
            echo "Target exists; bootstrap will not overwrite it"
            exit 1
          fi
      - name: Write exact repository files on remote runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = json.loads(r'''{
            "AGENTS.md": "# Remote-only governance\n## Mandatory execution policy\nZERO project code, tests, extraction, installs, scripts, pipelines, previews, or servers run locally. Local tools may only author text files. Never invoke shell commands on the user's machine. All Python extraction/normalization/test execution runs in GitHub Actions. All production site builds run in Cloudflare Pages CI; GitHub Actions additionally runs the requested check/build verification. Never start a dev server, including in CI.\n## Architecture\n- pipeline/: Python 3.11+, Pydantic v2 validation, deterministic normalization.\n- data/raw/: reviewed source records; data/normalized/: validated JSON, version controlled.\n- site/: Astro 4, TypeScript, Tailwind CSS, React islands, static HTML for crawlers.\n## Schema contract\npipeline/models.py and site/src/content/config.ts Zod definitions MUST stay synchronized, including nullable fields, enums, required keys, bounds, and URL validation. Update both in one commit. Remote contract checks validate every record and compare required fields plus positive/negative fixtures.\n## Editorial and financial integrity\nUnknown facts are null, never invented. Provider membership is a seed candidate, not a recommendation. Never claim a verified partnership or tier without evidence. Each record carries source URLs and an editorial review date. Weekly normalization does not refresh that review date or assert current verification. This baseline does not scrape; future extraction must be separately implemented on GitHub Actions and save evidence to data/raw.\nState rates describe individual state income tax only; distinguish corporations and federal tax. Do not rank provider brands as independent if ownership is shared. Calculator inputs are explicit assumptions, not cost segregation findings or tax advice.\n## Operations\nNo secrets or lead PII in git, workflow logs, or public data. Protected main requires a narrowly scoped bot bypass for the scheduled data-only commit, or change the pipeline to a PR workflow. CI failures block deployment. Production Pages build command is npm ci && npm run check && npm run build; root site, output dist. Node 20.\n",
            ".gitignore": "site/node_modules/\nsite/dist/\nsite/.astro/\nsite/src/content/qi/\nsite/src/content/costseg/\nsite/src/content/states/\n__pycache__/\n*.pyc\n.env*\n!.env.example\n",
            "pipeline/requirements.txt": "pydantic>=2.0,<3\nbeautifulsoup4>=4.12,<5\nhttpx>=0.27,<1\n",
            "pipeline/models.py": "\"\"\"Contract mirrored in site/src/content/config.ts. Execute only on Actions.\"\"\"\nfrom typing import Literal\nfrom pydantic import BaseModel, ConfigDict, Field, field_validator\nfrom datetime import date\nimport re\n\nclass Evidence(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", strict=True, allow_inf_nan=False)\n    sources: list[str] = Field(min_length=1)\n    reviewed_on: str\n    verification_status: Literal[\"baseline\", \"verified\"]\n    @field_validator(\"sources\")\n    @classmethod\n    def https_sources(cls, value):\n        if any(not x.startswith(\"https://\") or not x[8:].split(\"/\")[0] for x in value):\n            raise ValueError(\"HTTPS source required\")\n        return value\n    @field_validator(\"reviewed_on\")\n    @classmethod\n    def iso_date(cls, value):\n        if not re.fullmatch(r\"\\d{4}-\\d{2}-\\d{2}\", value):\n            raise ValueError(\"ISO date required\")\n        date.fromisoformat(value)\n        return value\n\nclass FeeRange(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", strict=True)\n    minimum_usd: float = Field(ge=0)\n    maximum_usd: float = Field(ge=0)\n    @field_validator(\"maximum_usd\")\n    @classmethod\n    def ordered(cls, value, info):\n        if value < info.data.get(\"minimum_usd\", 0):\n            raise ValueError(\"maximum must be >= minimum\")\n        return value\n\nclass QualifiedIntermediary(Evidence):\n    entity_id: str = Field(pattern=r\"^[a-z0-9]+(?:-[a-z0-9]+)*$\")\n    name: str = Field(min_length=1)\n    state: str = Field(pattern=r\"^[A-Z]{2}$\")\n    coverage_type: Literal[\"National\", \"Regional\"]\n    bonded_amount_usd: float | None = Field(ge=0)\n    escrow_type: str | None\n    services: list[Literal[\"forward\", \"reverse\", \"improvement\", \"dst\"]] | None\n    base_fee_range: FeeRange | None\n    website: str\n    verified_partner: bool\n    parent_group: str | None\n    @field_validator(\"website\")\n    @classmethod\n    def https_url(cls, value):\n        if not value.startswith(\"https://\") or not value[8:].split(\"/\")[0]:\n            raise ValueError(\"HTTPS URL required\")\n        return value\n\nclass CostSegProvider(Evidence):\n    entity_id: str = Field(pattern=r\"^[a-z0-9]+(?:-[a-z0-9]+)*$\")\n    name: str = Field(min_length=1)\n    coverage: list[str] = Field(min_length=1)\n    accredited_engineers: bool | None\n    audit_defense_included: bool | None\n    typical_fee_range: FeeRange | None\n    property_specialties: list[str] | None\n    contact_endpoint: str\n    partner_tier: Literal[\"anchor\", \"hybrid\", \"standard\"] | None\n    @field_validator(\"contact_endpoint\")\n    @classmethod\n    def https_url(cls, value):\n        if not value.startswith(\"https://\") or not value[8:].split(\"/\")[0]:\n            raise ValueError(\"HTTPS URL required\")\n        return value\n\nclass StateRules(Evidence):\n    state_code: str = Field(pattern=r\"^[A-Z]{2}$\")\n    state_name: str = Field(min_length=1)\n    capital_gains_tax_rate: float | None = Field(ge=0, le=1)\n    clawback_rules: bool\n    clawback_form: str | None\n    key_statutory_notes: list[str] = Field(min_length=1)\n    rate_description: str = Field(min_length=1)\n",
            "data/normalized/qi/ipx1031.json": "{\n  \"entity_id\": \"ipx1031\",\n  \"name\": \"IPX1031\",\n  \"state\": \"FL\",\n  \"coverage_type\": \"National\",\n  \"bonded_amount_usd\": null,\n  \"escrow_type\": null,\n  \"services\": null,\n  \"base_fee_range\": null,\n  \"website\": \"https://www.ipx1031.com/\",\n  \"verified_partner\": false,\n  \"parent_group\": \"Fidelity National Financial\",\n  \"reviewed_on\": \"2026-10-12\",\n  \"verification_status\": \"baseline\",\n  \"sources\": [\n    \"https://www.ipx1031.com/\"\n  ]\n}\n",
