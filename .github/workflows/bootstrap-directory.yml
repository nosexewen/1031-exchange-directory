            "data/normalized/states/tx.json": "{\n  \"state_code\": \"TX\",\n  \"state_name\": \"Texas\",\n  \"capital_gains_tax_rate\": 0,\n  \"clawback_rules\": false,\n  \"clawback_form\": null,\n  \"rate_description\": \"0% individual state income tax; federal and entity-level taxes may still apply.\",\n  \"key_statutory_notes\": [\n    \"Texas does not impose an individual state income tax. A 1031 exchange can still defer eligible federal gain.\",\n    \"No Texas individual income-tax clawback is identified in this baseline. Texas franchise tax treatment requires separate entity-specific review.\",\n    \"Use a qualified intermediary before receiving sale proceeds; federal identification and completion deadlines generally remain 45 and 180 days.\"\n  ],\n  \"sources\": [\n    \"https://comptroller.texas.gov/taxes/\"\n  ],\n  \"reviewed_on\": \"2026-10-12\",\n  \"verification_status\": \"baseline\"\n}\n",
