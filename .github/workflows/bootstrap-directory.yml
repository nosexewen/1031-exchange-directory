name: Bootstrap remote directory
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-1031-directory
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: https://1031-exchange-directory.pages.dev

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write exact repository files on runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = Path("exact-commit-files.json").read_text(encoding="utf-8")
          files = json.loads(payload)

          for rel_path, content in files.items():
              dest = Path(rel_path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding="utf-8")
          PY

      - name: Normalize baseline and create contract fixtures
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/seed_data.py
          python pipeline/contract.py > /tmp/contract.json

      - name: Generate npm lockfile and verify
        working-directory: site
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run contract -- /tmp/contract.json
          npm test
          npm run check
          npm run build

      - name: Commit and push directory files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          git diff --staged --quiet || git commit -m "Bootstrap complete 1031 exchange directory project"
          git push origin main
