      - name: Normalize baseline and create contract fixtures remotely
        working-directory: project
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/seed_data.py
          python pipeline/contract.py > /tmp/contract.json
      - name: Generate npm lockfile and verify remotely
        working-directory: project/site
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run contract -- /tmp/contract.json
          npm test
          npm run check
          npm run build
      - name: Create repository and commit exact files remotely
        working-directory: project
        run: |
          set -euo pipefail
          git init -b main
          git config user.name "$TARGET_OWNER"
          git config user.email "$TARGET_OWNER@users.noreply.github.com"
          git add .
          git commit -m "Initialize remote-only 1031 and cost segregation directory"
          gh auth setup-git
          gh repo create "$TARGET_OWNER/$TARGET_NAME" --private --source . --remote origin --push
          printf 'Repository: https://github.com/%s/%s\n' "$TARGET_OWNER" "$TARGET_NAME" >> "$GITHUB_STEP_SUMMARY"

