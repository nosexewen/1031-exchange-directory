ck_form\": \"FTB 3840\",\n    \"rate_description\": \"Variable: capital gains are taxed as ordinary income. No single taxpayer-independent rate.\",\n    \"key_statutory_notes\": [\n      \"California taxes capital gains as ordinary income; the applicable rate depends on taxable income and filing status.\",\n      \"Exchanging California real property for out-of-state property can preserve California-source deferred gain. Annual FTB 3840 reporting may continue through subsequent exchanges until recognition.\",\n      \"State conformity, residency, basis differences and applicable filing exceptions require review. This reporting obligation does not mean an immediate tax is due.\"\n    ],\n    \"sources\": [\n      \"https://www.ftb.ca.gov/file/personal/income-types/capital-gains-and-losses.html\",\n      \"https://www.ftb.ca.gov/file/personal/reporting-like-kind-exchanges.html\"\n    ],\n    \"reviewed_on\": \"2026-10-12\",\n    \"verification_status\": \"baseline\"\n  }\n]\n",
            "pipeline/seed_data.py": "\"\"\"Remote-only seed entrypoint. Reviewed baseline data is tracked in data/raw.\"\"\"\nfrom normalize import normalize\nif __name__ == \"__main__\":\n    normalize()\n",
            "pipeline/normalize.py": "\"\"\"Deterministic offline baseline normalization; GitHub Actions only.\"\"\"\nimport os\nimport json\nfrom pathlib import Path\nfrom models import QualifiedIntermediary, CostSegProvider, StateRules\nROOT = Path(__file__).resolve().parents[1]\nMODELS = {\"qi\": QualifiedIntermediary, \"costseg\": CostSegProvider, \"states\": StateRules}\n\ndef normalize():\n    if os.environ.get(\"GITHUB_ACTIONS\") != \"true\":\n        raise RuntimeError(\"Remote-only: normalization requires GitHub Actions\")\n    staged = {}\n    for kind, model in MODELS.items():\n        records = json.loads((ROOT / \"data/raw\" / f\"{kind}.json\").read_text())\n        seen = set()\n        staged[kind] = {}\n        for record in records:\n            validated = model.model_validate(record)\n            key = getattr(validated, \"entity_id\", None) or validated.state_code.lower()\n            if key in seen:\n                raise ValueError(f\"Duplicate {kind} ID: {key}\")\n            seen.add(key)\n            staged[kind][key] = validated.model_dump(mode=\"json\")\n    # Validate everything before writing anything.\n    for kind, records in staged.items():\n        folder = ROOT / \"data/normalized\" / kind\n        folder.mkdir(parents=True, exist_ok=True)\n        for path in folder.glob(\"*.json\"):\n            if path.stem not in records:\n                path.unlink()\n        for key, record in sorted(records.items()):\n            path = folder / f\"{key}.json\"\n            content = json.dumps(record, indent=2, ensure_ascii=False) + \"\\n\"\n            temp = path.with_suffix(\".tmp\")\n            temp.write_text(content)\n            temp.replace(path)\n\nif __name__ == \"__main__\":\n    normalize()\n",
            ".github/workflows/data-pipeline.yml": "name: Weekly data normalization\non:\n  workflow_dispatch:\n  schedule:\n    - cron: '17 3 * * 1'\npermissions:\n  contents: write\nconcurrency:\n  group: directory-main-writes\n  cancel-in-progress: false\njobs:\n  normalize:\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: pip install -r pipeline/requirements.txt\n      - run: python pipeline/normalize.py\n      - name: Commit normalized records only\n        run: |\n          git config user.name \"directory-data-bot\"\n          git config user.email \"directory-data-bot@users.noreply.github.com\"\n          git add -- data/normalized/\n          if git diff --cached --quiet; then exit 0; fi\n          git commit -m \"data: normalize reviewed directory records\"\n          git push origin HEAD:main\n",
            ".github/workflows/site-ci.yml": "name: Remote site verification\non:\n  pull_request:\n  push:\n  workflow_dispatch:\n  workflow_run:\n    workflows: [Weekly data normalization]\n    types: [completed]\npermissions:\n  contents: read\nconcurrency:\n  group: site-ci-${{ github.ref }}\n  cancel-in-progress: true\njobs:\n  verify:\n    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    env:\n      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://1031-exchange-directory.pages.dev' }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: npm\n          cache-dependency-path: site/package-lock.json\n      - run: pip install -r pipeline/requirements.txt\n      - run: python pipeline/contract.py > /tmp/contract.json\n      - run: npm ci\n        working-directory: site\n      - run: npm run contract -- /tmp/contract.json\n        working-directory: site\n      - run: npm test\n        working-directory: site\n      - run: npm run check\n        working-directory: site\n      - run: npm run build\n        working-directory: site\n",
            "site/package.json": "{\n  \"name\": \"1031-exchange-directory\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": {\n    \"node\": \">=20 <21\"\n  },\n  \"scripts\": {\n    \"precheck\": \"node scripts/prepare-content.mjs\",\n    \"check\": \"astro sync && astro check\",\n    \"prebuild\": \"node scripts/prepare-content.mjs\",\n    \"build\": \"astro build\",\n    \"contract\": \"tsx scripts/contract.ts\",\n    \"test\": \"tsx scripts/calculator.test.ts\"\n  },\n  \"dependencies\": {\n    \"astro\": \"^4.16.18\",\n    \"@astrojs/react\": \"^3.6.3\",\n    \"@astrojs/tailwind\": \"^5.1.4\",\n    \"react\": \"^18.3.1\",\n    \"react-dom\": \"^18.3.1\",\n    \"tailwindcss\": \"^3.4.17\",\n    \"zod\": \"^3.23.8\"\n  },\n  \"devDependencies\": {\n    \"@astrojs/check\": \"^0.9.4\",\n    \"@types/react\": \"^18.3.18\",\n    \"@types/react-dom\": \"^18.3.5\",\n    \"typescript\": \"^5.6.3\",\n    \"tsx\": \"^4.19.2\",\n    \"@types/node\": \"^20.17.10\"\n  }\n}\n",
            "site/.node-version": "20\n",
            "site/astro.config.mjs": "import { defineConfig } from 'astro/config';\nimport react from '@astrojs/react';\nimport tailwind from '@astrojs/tailwind';\nconst site = process.env.PUBLIC_SITE_URL;\nif (!site || !/^https:\\/\\//.test(site)) throw new Error('Set PUBLIC_SITE_URL to the canonical HTTPS deployment URL in CI.');\nexport default defineConfig({ site, output: 'static', integrations: [react(), tailwind()] });\n",
            "site/tailwind.config.mjs": "export default { content: ['./src/**/*.{astro,html,js,jsx,ts,tsx}'], theme: { extend: {} }, plugins: [] };\n",
            "site/tsconfig.json": "{\n  \"extends\": \"astro/tsconfigs/strict\",\n  \"compilerOptions\": {\n    \"jsx\": \"react-jsx\",\n    \"jsxImportSource\": \"react\"\n  },\n  \"include\": [\n    \"src/**/*\",\n    \"scripts/**/*.ts\",\n    \"functions/**/*.ts\",\n    \".astro/types.d.ts\"\n  ]\n}\n",
            "site/src/env.d.ts": "/// <reference types=\"astro/client\" />\n",
            "site/scripts/prepare-content.mjs": "import { mkdir, readdir, readFile, writeFile, rm } from 'node:fs/promises';\nif (process.env.GITHUB_ACTIONS !== 'true' && !['1','true'].includes(process.env.CF_PAGES ?? '')) {\n  throw new Error('Remote-only: site checks/builds require GitHub Actions or Cloudflare Pages CI.');\n}\nfor (const kind of ['qi','costseg','states']) {\n  const source = new URL('../../data/normalized/' + kind + '/', import.meta.url);\n  const target = new URL('../src/content/' + kind + '/', import.meta.url);\n  await rm(target, { recursive:true, force:true });\n  await mkdir(target, { recursive:true });\n  for (const name of await readdir(source)) {\n    if (!name.endsWith('.json')) continue;\n    const raw = await readFile(new URL(name, source), 'utf8');\n    JSON.parse(raw);\n    await writeFile(new URL(name, target), raw);\n  }\n}\n",
            "site/src/content/config.ts": "import { z } from 'zod';\n// Same schemas are used by Astro data collections and remote contract verification.\nconst https = z.string().refine(v => v.startsWith('https://') && v.slice(8).split('/')[0].length > 0, 'HTTPS URL required');\nconst date = z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/).refine(v => {\n  const d = new Date(v + 'T00:00:00Z');\n  return !Number.isNaN(d.valueOf()) && d.toISOString().slice(0,10) === v;\n}, 'Valid ISO calendar date required');\nconst evidence = {\n  sources: z.array(https).min(1),\n  reviewed_on: date,\n  verification_status: z.enum(['baseline','verified']),\n};\nconst id = z.string().regex(/^[a-z0-9]+(?:-[a-z0-9]+)*$/);\nconst state = z.string().regex(/^[A-Z]{2}$/);\nconst nonnegative = z.number().finite().nonnegative();\nexport const feeRangeSchema = z.object({\n  minimum_usd: nonnegative, maximum_usd: nonnegative,\n}).strict().refine(v => v.maximum_usd >= v.minimum_usd, 'Maximum must be >= minimum');\nexport const qiSchema = z.object({\n  ...evidence, entity_id:id, name:z.string().min(1), state,\n  coverage_type:z.enum(['National','Regional']),\n  bonded_amount_usd:nonnegative.nullable(), escrow_type:z.string().nullable(),\n  services:z.array(z.enum(['forward','reverse','improvement','dst'])).nullable(),\n  base_fee_range:feeRangeSchema.nullable(), website:https,\n  verified_partner:z.boolean(), parent_group:z.string().nullable(),\n}).strict();\nexport const costSegSchema = z.object({\n  ...evidence, entity_id:id, name:z.string().min(1),\n  coverage:z.array(z.string()).min(1),\n  accredited_engineers:z.boolean().nullable(), audit_defense_included:z.boolean().nullable(),\n  typical_fee_range:feeRangeSchema.nullable(), property_specialties:z.array(z.string()).nullable(),\n  contact_endpoint:https, partner_tier:z.enum(['anchor','hybrid','standard']).nullable(),\n}).strict();\nexport const stateRulesSchema = z.object({\n  ...evidence, state_code:state, state_name:z.string().min(1),\n  capital_gains_tax_rate:z.number().finite().min(0).max(1).nullable(),\n  clawback_rules:z.boolean(), clawback_form:z.string().nullable(),\n  key_statutory_notes:z.array(z.string()).min(1), rate_description:z.string().min(1),\n}).strict();\nexport type QI = z.infer<typeof qiSchema>;\nexport type CostSeg = z.infer<typeof costSegSchema>;\nexport type Rules = z.infer<typeof stateRulesSchema>;\nexport const collections = {\n  qi: { type: 'data' as const, schema: qiSchema },\n  costseg: { type: 'data' as const, schema: costSegSchema },\n  states: { type: 'data' as const, schema: stateRulesSchema },\n};\n",
            "pipeline/contract.py": "\"\"\"Generate acceptance fixtures and schema keys for remote Zod parity checks.\"\"\"\nimport json\nimport os\nfrom copy import deepcopy\nfrom normalize import ROOT, MODELS\nif os.environ.get(\"GITHUB_ACTIONS\") != \"true\":\n    raise RuntimeError(\"Remote-only contract verification\")\ncases = []\nfields = {}\nfor kind, model in MODELS.items():\n    fields[kind] = sorted(model.model_fields)\n    for file in sorted((ROOT / \"data/normalized\" / kind).glob(\"*.json\")):\n        record = json.loads(file.read_text())\n        model.model_validate(record)\n        variants = [record, {**record, \"unexpected\": True}]\n        for key in record:\n            missing = deepcopy(record)\n            del missing[key]\n            variants.append(missing)\n        variants.extend([\n            {**record, \"reviewed_on\": \"2026-02-30\"},\n            {**record, \"sources\": [\"http://insecure.example\"]},\n            {**record, \"verification_status\": \"invented\"},\n        ])\n        if kind == \"qi\":\n            variants.extend([{**record, \"coverage_type\": \"Local\"},\n                             {**record, \"bonded_amount_usd\": -1},\n                             {**record, \"verified_partner\": \"true\"},\n                             {**record, \"base_fee_range\": {\"minimum_usd\": 500, \"maximum_usd\": 100}},\n                             {**record, \"base_fee_range\": {\"minimum_usd\": 100, \"maximum_usd\": 500}}])\n        elif kind == \"costseg\":\n            variants.extend([{**record, \"partner_tier\": \"gold\"},\n                             {**record, \"coverage\": []},\n                             {**record, \"audit_defense_included\": \"true\"}])\n        else:\n            variants.extend([{**record, \"capital_gains_tax_rate\": 1.1},\n                             {**record, \"state_code\": \"California\"}])\n        for candidate in variants:\n            try:\n                model.model_validate(candidate)\n                accepted = True\n            except ValueError:\n                accepted = False\n            cases.append({\"kind\": kind, \"record\": candidate, \"accepted\": accepted})\nprint(json.dumps({\"fields\": fields, \"cases\": cases}))\n",
            "site/scripts/contract.ts": "import { readFileSync } from 'node:fs';\nimport { qiSchema, costSegSchema, stateRulesSchema } from '../src/content/config';\nif (process.env.GITHUB_ACTIONS !== 'true') throw new Error('Remote-only');\nconst schemas = { qi:qiSchema, costseg:costSegSchema, states:stateRulesSchema };\ntype Kind = keyof typeof schemas;\nconst contract = JSON.parse(readFileSync(process.argv[2], 'utf8')) as {\n  fields:Record<Kind,string[]>; cases:{kind:Kind;record:unknown;accepted:boolean}[];\n};\nfor (const kind of Object.keys(schemas) as Kind[]) {\n  const actual = Object.keys(schemas[kind].shape).sort();\n  if (JSON.stringify(actual) !== JSON.stringify(contract.fields[kind])) throw new Error('Field drift: ' + kind);\n}\nfor (const [index,c] of contract.cases.entries()) {\n  if (schemas[c.kind].safeParse(c.record).success !== c.accepted) throw new Error('Acceptance drift at ' + index);\n}\nconsole.log('Schema parity fixtures passed: ' + contract.cases.length);\n",
            "site/src/styles/global.css": "@tailwind base;\n@tailwind components;\n@tailwind utilities;\n:root { color-scheme: light; --ink:#142b37; --muted:#405664; --paper:#f5f7f8; --accent:#075c51; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:system-ui,sans-serif; line-height:1.6; }\nmain { max-width:1120px; margin:auto; padding:2rem 1rem 4rem; }\nheader,footer { background:white; border-bottom:1px solid #cbd5dc; padding:1rem; }\nheader nav,footer p { max-width:1120px; margin:auto; }\nnav { display:flex; flex-wrap:wrap; gap:1.25rem; align-items:center; }\nh1 { font-size:clamp(2rem,5vw,3.5rem); line-height:1.12; font-weight:750; margin:1.5rem 0; max-width:900px; }\nh2 { font-size:1.5rem; font-weight:700; margin:2rem 0 1rem; }\nh3 { font-weight:700; font-size:1.2rem; }\na { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }\n.button,button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:.6rem 1rem; border-radius:6px; background:var(--accent); color:white; border:0; font-weight:650; cursor:pointer; text-decoration:none; }\nbutton:disabled { opacity:.65; cursor:wait; }\n:focus-visible { outline:3px solid #bd5700; outline-offset:3px; }\n.card { background:white; border:1px solid #cbd5dc; border-radius:10px; padding:1.5rem; margin:1rem 0; }\n.grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); }\n.muted { color:var(--muted); }\n.notice { border-left:4px solid #bd5700; padding:1rem; background:#fff4df; }\n.table-scroll { overflow-x:auto; }\ntable { width:100%; border-collapse:collapse; background:white; }\ncaption { text-align:left; margin:1rem 0; font-weight:600; }\nth,td { text-align:left; vertical-align:top; border-bottom:1px solid #cbd5dc; padding:1rem; }\nth { background:#e8eef1; }\nlabel { display:block; font-weight:600; margin:.8rem 0 .3rem; }\ninput,select { width:100%; padding:.65rem; border:1px solid #758997; border-radius:5px; min-height:44px; background:white; color:var(--ink); }\ninput[type=checkbox] { width:20px; min-height:20px; margin-right:.5rem; }\ndialog { width:min(94vw,620px); max-height:90vh; overflow:auto; padding:1.5rem; border:1px solid #758997; border-radius:10px; }\ndialog::backdrop { background:rgb(8 24 33 / .65); }\n.error { color:#9f2019; }\n.result { font-size:2rem; font-weight:750; }\n.skip { position:absolute; top:-100px; }\n.skip:focus { top:0; background:white; z-index:10; padding:1rem; }\nul { list-style:disc; padding-left:1.5rem; }\n",
            "site/src/layouts/Base.astro": "---\nimport '../styles/global.css';\ninterface Props { title:string; description:string; graph?:Record<string,unknown>; }\nconst { title,description,graph } = Astro.props;\nconst canonical = new URL(Astro.url.pathname, Astro.site);\nconst json = graph ? JSON.stringify(graph).replace(/</g, '\\\\u003c') : null;\n---\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n  <title>{title}</title>\n  <meta name=\"description\" content={description} />\n  <link rel=\"canonical\" href={canonical} />\n  {json && <script type=\"application/ld+json\" set:html={json} />}\n</head>\n<body>\n  <a class=\"skip\" href=\"#main\">Skip to content</a>\n  <header><nav aria-label=\"Primary\"><a href=\"/\">Exchange &amp; Basis</a><a href=\"/cost-segregation/\">Cost segregation</a><a href=\"/methodology/\">Methodology</a></nav></header>\n  <main id=\"main\"><slot /></main>\n  <footer><p>Educational baseline directory. Provider terms require direct verification. Estimates do not establish tax eligibility. <a href=\"/privacy/\">Privacy</a></p></footer>\n</body>\n</html>\n",
            "site/src/pages/index.astro": "---\nimport Base from '../layouts/Base.astro';\nimport { getCollection } from 'astro:content';\nconst states = await getCollection('states');\n---\n<Base title=\"1031 Exchange & Cost Segregation Directory\" description=\"Compare 1031 exchange state rules and qualified intermediary candidates, with an explicit-assumption cost segregation calculator.\">\n<p class=\"muted\">STATE RULES · PROVIDER COMPARISONS · BASIS ESTIMATES</p>\n<h1>Keep the exchange rules and the depreciation assumptions visible.</h1>\n<p>Start with the state where your relinquished property is located. Compare provider candidates, inspect unknown terms, and estimate potential accelerated depreciation separately.</p>\n<div class=\"grid\">{states.map(({ data:s }) => <article class=\"card\">\n  <h2>{s.state_name}</h2><p>{s.rate_description}</p>\n  <p>{s.clawback_rules ? 'Out-of-state exchange reporting notice' : 'No personal income-tax clawback identified in baseline'}</p>\n  <a class=\"button\" href={'/1031-exchange/' + s.state_name.toLowerCase() + '/'}>View {s.state_name} rules</a>\n</article>)}</div>\n<h2>Cost segregation after an exchange</h2>\n<p>A replacement property's purchase price is not automatically its depreciable tax basis. Use a CPA-confirmed excess basis and exclude land.</p>\n<a class=\"button\" href=\"/cost-segregation/\">Open calculator and provider comparison</a>\n</Base>\n",
            "site/src/pages/1031-exchange/[state]/index.astro": "---\nimport { getCollection } from 'astro:content';\nimport Base from '../../../layouts/Base.astro';\nimport CostSegCalculator from '../../../components/CostSegCalculator';\nimport type { Rules, QI } from '../../../content/config';\nexport async function getStaticPaths() {\n  const states = await getCollection('states');\n  const providers = await getCollection('qi');\n  return states.map(({ data:s }) => ({\n    params:{ state:s.state_name.toLowerCase() },\n    props:{ rules:s, providers:providers.map(p=>p.data).filter(p=>p.coverage_type==='National'||p.state===s.state_code) },\n  }));\n}\ninterface Props { rules:Rules; providers:QI[]; }\nconst { rules:s, providers } = Astro.props;\nconst url = new URL(Astro.url.pathname, Astro.site).href;\nconst faqs = [\n  { question:'Does ' + s.state_name + ' apply one flat capital gains tax rate?', answer:s.rate_description },\n  { question:'What happens when replacement property is outside the state?', answer:s.clawback_rules\n    ? 'California-source deferred gain can remain reportable. Review FTB 3840 annual reporting and recognition rules with your tax adviser.'\n    : 'No personal income-tax clawback is identified in this baseline. Federal gain, residency in other states and entity-level tax still require review.' },\n  { question:'Are the listed intermediaries verified partners?', answer:'No. These are baseline provider candidates. Fees, bonding, escrow protections and service availability must be confirmed directly. National coverage does not establish suitability.' },\n];\nconst graph = {\n  '@context':'https://schema.org',\n  '@graph':[\n    { '@type':'State','@id':url+'#state',name:s.state_name, containedInPlace:{'@type':'Country',name:'United States'} },\n    { '@type':'WebPage','@id':url,url,name:s.state_name+' 1031 Exchange Directory',\n      about:{'@id':url+'#state'}, mainEntity:{'@id':url+'#faq'} },\n    { '@type':'FAQPage','@id':url+'#faq', mainEntity:faqs.map(f=>({\n      '@type':'Question',name:f.question, acceptedAnswer:{'@type':'Answer',text:f.answer},\n    })) },\n    ...providers.map(p=>({ '@type':'FinancialService','@id':p.website+'#financial-service',\n      name:p.name,url:p.website,areaServed:p.coverage_type==='National'\n        ? {'@type':'Country',name:'United States'} : {'@id':url+'#state'},\n      description:'Qualified intermediary baseline candidate; terms require direct verification.' })),\n  ],\n};\nconst money=(n:number|null)=>n===null?'Unknown':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);\n---\n<Base title={s.state_name+' 1031 Exchange Rules & Intermediaries'} description={s.rate_description} graph={graph}>\n<p class=\"muted\">1031 EXCHANGE / {s.state_name.toUpperCase()}</p>\n<h1>{s.state_name}: compare the rules before choosing an intermediary.</h1>\n<section aria-labelledby=\"summary\">\n<h2 id=\"summary\">{s.state_name} tax rules: {s.rate_description}</h2>\n<p class={s.clawback_rules?'notice':''}>{s.clawback_rules\n  ? 'Clawback reporting notice: ' + s.clawback_form + ' may remain required when California property is exchanged for out-of-state replacement property.'\n  : 'No personal income-tax clawback identified in this baseline. This does not remove federal or entity-level tax obligations.'}</p>\n<ul>{s.key_statutory_notes.map(note=><li>{note}</li>)}</ul>\n<p class=\"muted\">Editorial baseline review: <time datetime={s.reviewed_on}>{s.reviewed_on}</time>. Status: {s.verification_status}. Updates are not automatic legal verification.</p>\n<ul>{s.sources.map(source=><li><a href={source} target=\"_blank\" rel=\"noopener noreferrer\">Primary source: {new URL(source).hostname}</a></li>)}</ul>\n</section>\n<h2>Qualified intermediary candidates serving {s.state_name}</h2>\n<p>Unknown means no verified term in this dataset. Parent groups are shown to expose shared ownership; confirm current ownership directly.</p>\n<div class=\"table-scroll\" role=\"region\" aria-label=\"Intermediary comparison\" tabindex=\"0\">\n<table><caption>Baseline terms; request a written quote and escrow documentation.</caption>\n<thead><tr><th scope=\"col\">Intermediary</th><th scope=\"col\">Coverage / group</th><th scope=\"col\">Bonding / escrow</th><th scope=\"col\">Services / fee</th><th scope=\"col\">Intake</th></tr></thead>\n<tbody>{providers.map(p=><tr>\n<th scope=\"row\"><a href={p.website}>{p.name}</a><p class=\"muted\">{p.verified_partner?'Verified partner':'Baseline candidate'}</p></th>\n<td>{p.coverage_type}<p>{p.parent_group??'Parent group unknown'}</p></td>\n<td>{money(p.bonded_amount_usd)}<p>{p.escrow_type??'Escrow terms unknown'}</p></td>\n<td>{p.services?.join(', ')??'Services unverified'}<p>{p.base_fee_range?money(p.base_fee_range.minimum_usd)+'–'+money(p.base_fee_range.maximum_usd):'Fee unknown'}</p></td>\n<td><a class=\"button\" href={'/intake/?provider='+encodeURIComponent(p.entity_id)} aria-label={'Request Intake for '+p.name}>Request Intake</a></td>\n</tr>)}</tbody></table></div>\n<h2>Estimate the excess-basis depreciation scenario</h2>\n<CostSegCalculator client:visible />\n<section aria-labelledby=\"faq\"><h2 id=\"faq\">Questions answered</h2>\n{faqs.map(f=><article class=\"card\"><h3>{f.question}</h3><p>{f.answer}</p></article>)}\n</section>\n</Base>\n",
            "site/src/lib/calculator.ts": "export const propertyTypes = ['Industrial','NNN Retail','Multifamily'] as const;\nexport type PropertyType = typeof propertyTypes[number];\nexport interface Inputs {\n  propertyType:PropertyType; purchasePrice:number; landValue:number;\n  excessBasis:number; allocationPercent:number; bonusPercent:number; placedMonth:number;\n}\nexport function estimate(v:Inputs) {\n  if (!propertyTypes.includes(v.propertyType) || Object.values(v).some(x=>typeof x==='number'&&!Number.isFinite(x))\n    || v.purchasePrice<=0 || v.landValue<0 || v.landValue>=v.purchasePrice\n    || v.excessBasis<=0 || v.excessBasis>v.purchasePrice-v.landValue\n    || v.allocationPercent<0 || v.allocationPercent>100\n    || v.bonusPercent<0 || v.bonusPercent>100\n    || !Number.isInteger(v.placedMonth) || v.placedMonth<1 || v.placedMonth>12) return null;\n  const life=v.propertyType==='Multifamily'?27.5:39;\n  const eligible=v.excessBasis*v.allocationPercent/100;\n  const bonus=eligible*v.bonusPercent/100;\n  // Illustrative 80% five-year / 20% fifteen-year, half-year MACRS.\n  const shortLifeRegular=(eligible-bonus)*(.8*.20+.2*.05);\n  const firstYearFraction=(12-v.placedMonth+.5)/12;\n  const baseline=v.excessBasis/life*firstYearFraction;\n  const yearOne=bonus+shortLifeRegular+(v.excessBasis-eligible)/life*firstYearFraction;\n  return { eligible,bonus,yearOne,baseline,incremental:yearOne-baseline,life };\n}\n",
            "site/src/components/LeadModal.tsx": "import { useEffect, useRef, useState } from 'react';\ntype Turnstile = { render:(element:HTMLElement,options:Record<string,unknown>)=>string; remove:(id:string)=>void };\ndeclare global { interface Window { turnstile?:Turnstile; } }\nlet turnstileReady:Promise<void>|undefined;\nfunction loadTurnstile() {\n  if (window.turnstile) return Promise.resolve();\n  if (!turnstileReady) turnstileReady=new Promise((resolve,reject)=>{\n    const script=document.createElement('script');\n    script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';\n    script.async=true; script.onload=()=>resolve(); script.onerror=()=>{turnstileReady=undefined;reject(new Error('Challenge unavailable'));};\n    document.head.append(script);\n  });\n  return turnstileReady;\n}\ninterface Props { buttonText:string; providerId?:string; metrics?:Record<string,unknown>; }\nexport default function LeadModal({buttonText,providerId,metrics}:Props) {\n  const dialog=useRef<HTMLDialogElement>(null);\n  const widget=useRef<HTMLDivElement>(null);\n  const [open,setOpen]=useState(false), [token,setToken]=useState(''), [status,setStatus]=useState(''), [busy,setBusy]=useState(false), [sent,setSent]=useState(false);\n  const key=import.meta.env.PUBLIC_TURNSTILE_SITE_KEY;\n  const configured=Boolean(key && import.meta.env.PUBLIC_PRIVACY_CONTACT);\n  useEffect(()=>{\n    if (!open || !configured) return;\n    let cancelled=false, id:string|undefined;\n    loadTurnstile().then(()=>{\n      if (cancelled || !widget.current || !window.turnstile) return;\n      id=window.turnstile.render(widget.current,{\n        sitekey:key, callback:(value:string)=>setToken(value),\n        'expired-callback':()=>setToken(''), 'error-callback':()=>{setToken('');setStatus('Verification failed. Reopen to retry.');},\n      });\n    }).catch(()=>setStatus('Verification unavailable. Reopen to retry.'));\n    return ()=>{cancelled=true;if(id)window.turnstile?.remove(id);setToken('');};\n  },[open,configured,key]);\n  const close=()=>{dialog.current?.close();setOpen(false);};\n  return <>\n    <button type=\"button\" onClick={()=>{setStatus('');setSent(false);dialog.current?.showModal();setOpen(true);}}>{buttonText}</button>\n    <dialog ref={dialog} aria-label={buttonText} onClose={()=>setOpen(false)}>\n      <h2>{buttonText}</h2>\n      {!configured ? <p className=\"notice\">Intake is not activated. The directory operator must configure privacy contact, storage and verification before collecting requests.</p> :\n      sent ? <p role=\"status\">Request saved. No provider has been notified automatically.</p> :\n      <form onSubmit={async(e)=>{\n        e.preventDefault();\n        if (!token || busy) return;\n        const form=new FormData(e.currentTarget);\n        setBusy(true);setStatus('');\n        try {\n          const response=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({\n            name:form.get('name'), email:form.get('email'), consent:form.get('consent')==='on',\n            provider_id:providerId??null, metrics:metrics??null, turnstile_token:token,\n          })});\n          if(!response.ok) throw new Error('Request could not be saved. Close and retry.');\n          setSent(true);\n        } catch {setStatus('Request could not be saved. Close and retry.');}\n        finally {setBusy(false);}\n      }}>\n        <p>Request goes to the directory operator. Provider outreach requires your later authorization.</p>\n        <label>Name<input name=\"name\" autoComplete=\"name\" maxLength={100} required /></label>\n        <label>Email<input name=\"email\" type=\"email\" autoComplete=\"email\" maxLength={254} required /></label>\n        <label><input name=\"consent\" type=\"checkbox\" required />I authorize the directory operator to store my request for up to 30 days and respond by email. <a href=\"/privacy/\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy terms</a></label>\n        <div ref={widget} />\n        <p role=\"alert\" className=\"error\">{status}</p>\n        <button type=\"submit\" disabled={!token||busy}>{busy?'Saving…':'Submit request'}</button>\n      </form>}\n      <button type=\"button\" className=\"mt-4\" onClick={close}>Close</button>\n    </dialog>\n  </>;\n}\n",
            "site/src/components/CostSegCalculator.tsx": "import { useId, useState } from 'react';\nimport { estimate, propertyTypes, type Inputs, type PropertyType } from '../lib/calculator';\nimport LeadModal from './LeadModal';\nconst money=(n:number)=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);\nexport default function CostSegCalculator() {\n  const id=useId();\n  const [v,set]=useState<Inputs>({propertyType:'Industrial',purchasePrice:2000000,landValue:400000,excessBasis:500000,allocationPercent:20,bonusPercent:0,placedMonth:1});\n  const result=estimate(v);\n  const fields=[\n    ['purchasePrice','Purchase price ($)',1,1000000000],\n    ['landValue','Total land allocation ($)',0,1000000000],\n    ['excessBasis','CPA-confirmed excess depreciable basis, excluding land ($)',1,1000000000],\n    ['allocationPercent','Assumed short-life allocation (%)',0,100],\n    ['bonusPercent','Confirmed eligible bonus rate (%)',0,100],\n    ['placedMonth','Placed-in-service month (1–12)',1,12],\n  ] as const;\n  return <section className=\"card\" aria-label=\"Excess basis calculator\">\n    <p className=\"notice\">Illustrative excess-basis scenario only. Purchase price does not establish tax basis. Enter an excess basis already excluding land, confirmed by your CPA. Carryover basis is excluded from this estimate.</p>\n    <div className=\"grid\">\n      <label htmlFor={id+'type'}>Property type<select id={id+'type'} value={v.propertyType} onChange={e=>set({...v,propertyType:e.target.value as PropertyType})}>{propertyTypes.map(t=><option key={t}>{t}</option>)}</select></label>\n      {fields.map(([key,label,min,max])=><label key={key} htmlFor={id+key}>{label}<input id={id+key} type=\"number\" min={min} max={max} step={key==='placedMonth'?1:'any'} value={Number.isNaN(v[key])?'':v[key]} onChange={e=>set({...v,[key]:e.target.valueAsNumber})} /></label>)}\n    </div>\n    {!result ? <p role=\"alert\" className=\"error\">Enter valid values. Excess depreciable basis must be positive and cannot exceed purchase price less land.</p> :\n    <div aria-live=\"polite\" aria-atomic=\"true\">\n      <h3>Estimated Year 1 depreciation on excess basis</h3><p className=\"result\">{money(result.yearOne)}</p>\n      <p>Baseline without reclassification: {money(result.baseline)}. Estimated incremental depreciation: {money(result.incremental)}.</p>\n      <p>Assumed short-life basis: {money(result.eligible)}. Bonus component: {money(result.bonus)}. These are deductions, not cash savings.</p>\n    </div>}\n    <p className=\"muted\">Model: 80% of reclassified basis uses 5-year property at a 20% first-year half-year MACRS rate; 20% uses 15-year property at 5%. Remaining building basis uses {v.propertyType==='Multifamily'?'27.5':'39'}-year straight-line depreciation with a mid-month convention. Allocation and bonus rate are user assumptions; default bonus is 0%. Mid-quarter convention, ADS, elections, used-property acquisition rules, state conformity, passive-loss limits, recapture and carryover-basis treatment are excluded.</p>\n    <p><a href=\"https://www.irs.gov/publications/p946\" target=\"_blank\" rel=\"noopener noreferrer\">IRS Publication 946: depreciation and exchange basis rules</a></p>\n    {result && <LeadModal buttonText=\"Request Preliminary Benefit Analysis\" metrics={{...v,...result}} />}\n  </section>;\n}\n",
            "site/src/components/ProviderIntake.tsx": "import LeadModal from './LeadModal';\nexport default function ProviderIntake({providers}:{providers:{id:string;name:string;url:string}[]}) {\n  const id=typeof window==='undefined'?null:new URLSearchParams(window.location.search).get('provider');\n  const provider=providers.find(p=>p.id===id);\n  return <section className=\"card\">\n    <h2>{provider?'Intake interest: '+provider.name:'General directory intake'}</h2>\n    <p>This submits interest to the directory operator. It does not establish a provider relationship or transmit your information to a provider.</p>\n    {provider && <p><a href={provider.url}>Contact {provider.name} directly</a></p>}\n    <LeadModal buttonText=\"Request Intake\" providerId={provider?.id} />\n  </section>;\n}\n",
            "site/src/pages/intake/index.astro": "---\nimport Base from '../../layouts/Base.astro';\nimport ProviderIntake from '../../components/ProviderIntake';\nimport { getCollection } from 'astro:content';\nconst qis = await getCollection('qi');\nconst cs = await getCollection('costseg');\nconst providers = [...qis.map(({data:p})=>({id:p.entity_id,name:p.name,url:p.website})),...cs.map(({data:p})=>({id:p.entity_id,name:p.name,url:p.contact_endpoint}))];\n---\n<Base title=\"Request directory intake\" description=\"Submit interest to the directory operator or contact a provider directly.\">\n<h1>Request intake</h1>\n<ProviderIntake providers={providers} client:only=\"react\" />\n</Base>\n",
            "site/src/pages/cost-segregation/index.astro": "---\nimport Base from '../../layouts/Base.astro';\nimport CostSegCalculator from '../../components/CostSegCalculator';\nimport { getCollection } from 'astro:content';\nconst providers = await getCollection('costseg');\nconst bool=(v:boolean|null)=>v===null?'Unknown':v?'Yes':'No';\n---\n<Base title=\"Cost Segregation Providers & Excess Basis Calculator\" description=\"Compare baseline cost segregation provider candidates and estimate first-year depreciation using explicit excess-basis assumptions.\">\n<h1>Cost segregation: compare terms and test a basis scenario.</h1>\n<h2>Accelerated depreciation depends on tax basis, asset classification and eligibility.</h2>\n<p>These providers are seed candidates. Accreditation, audit defense, pricing and specialties remain unverified. No partner tier is assigned without an agreement.</p>\n<div class=\"table-scroll\" role=\"region\" aria-label=\"Cost segregation comparison\" tabindex=\"0\">\n<table><caption>Cost segregation provider baseline comparison</caption>\n<thead><tr><th scope=\"col\">Provider</th><th scope=\"col\">Coverage</th><th scope=\"col\">Engineers / audit defense</th><th scope=\"col\">Fees / specialties</th><th scope=\"col\">Intake</th></tr></thead>\n<tbody>{providers.map(({data:p})=><tr>\n<th scope=\"row\"><a href={p.contact_endpoint}>{p.name}</a></th><td>{p.coverage.join(', ')}<p>Tier: {p.partner_tier??'Unassigned'}</p></td>\n<td>Accredited engineers: {bool(p.accredited_engineers)}<p>Audit defense: {bool(p.audit_defense_included)}</p></td>\n<td>{p.typical_fee_range?'$'+p.typical_fee_range.minimum_usd+'–$'+p.typical_fee_range.maximum_usd:'Fees unknown'}<p>{p.property_specialties?.join(', ')??'Specialties unverified'}</p></td>\n<td><a class=\"button\" aria-label={'Request Intake for '+p.name} href={'/intake/?provider='+p.entity_id}>Request Intake</a></td>\n</tr>)}</tbody></table></div>\n<CostSegCalculator client:visible />\n</Base>\n",
            "site/functions/api/lead.ts": "// Executes only on Cloudflare Pages Functions; never log request bodies.\ninterface Env {\n  LEADS?: { put:(key:string,value:string,options:{expirationTtl:number})=>Promise<void> };\n  TURNSTILE_SECRET_KEY?:string;\n  PRIVACY_CONTACT?:string;\n}\ninterface Context { request:Request; env:Env; }\nconst providerIds=new Set(['ipx1031','first-american-exchange','asset-preservation','accruit','exeter','engineered-tax-services','kbkg','cssi']);\nfunction reply(status:number,body:Record<string,unknown>) {\n  return Response.json(body,{status,headers:{'Cache-Control':'no-store','X-Content-Type-Options':'nosniff'}});\n}\nexport const onRequestPost=async({request,env}:Context):Promise<Response>=>{\n  if (!env.LEADS || !env.TURNSTILE_SECRET_KEY || !env.PRIVACY_CONTACT) return reply(503,{error:'Intake not configured'});\n  const url=new URL(request.url);\n  if(request.headers.get('Origin')!==url.origin) return reply(403,{error:'Origin rejected'});\n  if(!request.headers.get('Content-Type')?.startsWith('application/json')) return reply(415,{error:'JSON required'});\n  if(Number(request.headers.get('Content-Length')??0)>8192) return reply(413,{error:'Request too large'});\n  try {\n    const text=await request.text();\n    if(new TextEncoder().encode(text).length>8192) return reply(413,{error:'Request too large'});\n    const body:unknown=JSON.parse(text);\n    if(!body || typeof body!=='object' || Array.isArray(body)) return reply(400,{error:'Invalid request'});\n    const b=body as Record<string,unknown>;\n    if(typeof b.name!=='string'||!b.name.trim()||b.name.length>100\n      ||typeof b.email!=='string'||b.email.length>254||! /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(b.email)\n      ||b.consent!==true||typeof b.turnstile_token!=='string'||b.turnstile_token.length>2048\n      ||(b.provider_id!==null && (typeof b.provider_id!=='string'||!providerIds.has(b.provider_id)))) {\n      return reply(400,{error:'Invalid request'});\n    }\n    let metrics:Record<string,string|number>|null=null;\n    if(b.metrics!==null) {\n      if(!b.metrics||typeof b.metrics!=='object'||Array.isArray(b.metrics)) return reply(400,{error:'Invalid metrics'});\n      const input=b.metrics as Record<string,unknown>;\n      if(!['Industrial','NNN Retail','Multifamily'].includes(String(input.propertyType))) return reply(400,{error:'Invalid property type'});\n      metrics={propertyType:String(input.propertyType)};\n      for(const key of ['purchasePrice','landValue','excessBasis','allocationPercent','bonusPercent','placedMonth']) {\n        const value=input[key];\n        if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>1000000000) return reply(400,{error:'Invalid metric'});\n        metrics[key]=value;\n      }\n      // Recompute estimates in any future analysis; never trust client-supplied results.\n    }\n    const challenge=await fetch('https://challenges.cloudflare.com/turnstile/v0/siteverify',{\n      method:'POST',body:new URLSearchParams({secret:env.TURNSTILE_SECRET_KEY,response:b.turnstile_token}),\n    });\n    if(!challenge.ok) return reply(503,{error:'Verification unavailable'});\n    const verified=await challenge.json() as {success?:boolean;hostname?:string};\n    if(!verified.success||verified.hostname!==url.hostname) return reply(403,{error:'Verification failed'});\n    const id=crypto.randomUUID();\n    await env.LEADS.put('lead:'+id,JSON.stringify({\n      id,name:b.name.trim(),email:b.email.trim(),provider_id:b.provider_id,metrics,\n      consent:true,consent_version:'2026-10-12',created_at:new Date().toISOString(),\n    }),{expirationTtl:2592000});\n    return reply(201,{saved:true,id});\n  } catch {\n    return reply(503,{error:'Request could not be saved'});\n  }\n};\nexport const onRequestGet=()=>reply(405,{error:'POST required'});\n",
            "site/src/pages/privacy/index.astro": "---\nimport Base from '../../layouts/Base.astro';\nconst contact=import.meta.env.PUBLIC_PRIVACY_CONTACT;\n---\n<Base title=\"Directory intake privacy\" description=\"How directory intake requests are stored and deleted.\">\n<h1>Intake privacy</h1>\n<p>Intake collects name, email, provider interest, optional property metrics and explicit consent. Cloudflare Turnstile processes a security challenge. No request information is committed to GitHub.</p>\n<p>Requests are stored in private Cloudflare KV for up to 30 days, then expire. Only the directory operator and authorized Cloudflare account administrators can access storage. No automatic provider forwarding occurs.</p>\n<p>The operator may respond by email to the requested analysis or intake. Sharing data with a provider requires further authorization. Do not submit tax returns, social security numbers or bank details.</p>\n<p>{contact?'Directory controller and deletion contact: '+contact:'The operator has not configured a privacy contact. Intake remains disabled until it is configured.'}</p>\n<p>Cloudflare provides hosting, storage and bot verification. Cross-border processing can occur. No analytics or advertising cookies are installed by this starter.</p>\n</Base>\n",
            "site/src/pages/methodology/index.astro": "---\nimport Base from '../../layouts/Base.astro';\n---\n<Base title=\"Directory methodology\" description=\"Baseline sources, unknown provider terms, editorial verification and calculator assumptions.\">\n<h1>Methodology and verification</h1>\n<h2>Baseline candidates are not verified partners.</h2>\n<p>The initial dataset lists five national qualified intermediary candidates and three cost segregation candidates. Null fields mean unknown; an explicit false means a negative assertion. Coverage, names and ownership groups are baseline editorial leads requiring current confirmation.</p>\n<p>Provider fees, escrow terms, bonding, audit-defense terms and credentials are not inferred. Tier is unassigned until a commercial agreement exists. Sponsorship must be disclosed separately and cannot change state rules.</p>\n<h2>Weekly validation is not weekly fact checking.</h2>\n<p>The pipeline validates reviewed raw records and produces normalized records. It does not scrape websites, rewrite review dates or claim facts were freshly verified. A factual update requires an editorial source change and a new review date.</p>\n<h2>State summaries have a narrow scope.</h2>\n<p>Displayed rates describe individual state income tax only. California is variable. Corporate taxes, federal taxes, residency, state conformity and exchange eligibility need separate review.</p>\n<h2>Structured data follows visible content.</h2>\n<p>State pages include State, FinancialService and FAQPage nodes. FAQ answers match the visible answers. Structured data does not guarantee search placement, rich results or AI citations.</p>\n<h2>Calculator limits</h2>\n<p>The tool uses assumed allocations and CPA-confirmed excess depreciable basis. It excludes carryover basis and does not determine whether bonus depreciation is legally available. Short-life allocation is an assumption rather than a study result.</p>\n</Base>\n",
            "site/public/llms.txt": "# Exchange & Basis\n> Baseline 1031 exchange rules and provider comparisons with explicit unknowns. No verified partnerships are asserted.\n## State rules\n- [Texas](/1031-exchange/texas/): Individual state income tax summary and QI candidates.\n- [Florida](/1031-exchange/florida/): Individual tax summary and entity-tax scope limits.\n- [California](/1031-exchange/california/): Variable ordinary-income treatment and FTB 3840 reporting.\n## Cost segregation\n- [Providers and calculator](/cost-segregation/): Assumed excess-basis depreciation scenarios, not eligibility determinations.\n- [Methodology](/methodology/): Baseline verification status, model assumptions and sources.\n- [Privacy](/privacy/): Intake retention and operator contact.\n",
            "site/public/robots.txt": "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /intake/\n",
            "site/public/_headers": "/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n  Permissions-Policy: camera=(), microphone=(), geolocation=()\n",
            "site/scripts/calculator.test.ts": "import assert from 'node:assert/strict';\nimport { estimate, type Inputs } from '../src/lib/calculator';\nif(process.env.GITHUB_ACTIONS!=='true') throw new Error('Remote-only');\nconst base:Inputs={propertyType:'Industrial',purchasePrice:2000000,landValue:400000,excessBasis:500000,allocationPercent:20,bonusPercent:0,placedMonth:1};\nassert.equal(estimate({...base,excessBasis:1600001}),null);\nassert.equal(estimate({...base,landValue:2000000}),null);\nassert.equal(estimate({...base,bonusPercent:101}),null);\nassert.equal(estimate({...base,placedMonth:1.5}),null);\nassert.equal(estimate({...base,purchasePrice:NaN}),null);\nassert.equal(estimate({...base,allocationPercent:0})?.incremental,0);\nconst full=estimate({...base,allocationPercent:100,bonusPercent:100});\nassert.equal(full?.yearOne,500000);\nconst zero=estimate(base)!;\nconst bonus=estimate({...base,bonusPercent:100})!;\nassert.ok(bonus.yearOne>zero.yearOne);\nassert.ok(estimate({...base,placedMonth:12})!.baseline<zero.baseline);\nconsole.log('Calculator boundary and scenario checks passed');\n",
            "README.md": "# 1031 Exchange & Cost Segregation GEO Directory\n\n## Remote-only\nRead AGENTS.md before any work. Do not run any commands, npm installs, Python, builds, tests, scrapers or servers locally. All commands below belong on remote runners or in the Cloudflare Pages build configuration.\n\n## Initial commit\nThe delivered bootstrap workflow is self-contained. Add it via GitHub's web editor as .github/workflows/bootstrap-directory.yml in an existing repository that you own. Add an Actions secret DIRECTORY_BOOTSTRAP_TOKEN containing a classic PAT with repo and workflow scopes. A token capable of creating a repository and pushing workflow files is required; the source repository GITHUB_TOKEN is not sufficient. Run it once from Actions. The workflow creates a NEW PRIVATE repository under the authenticated token owner's account, generates site/package-lock.json remotely, validates schemas and the Astro build, then pushes main. It refuses to overwrite an existing target. After completion remove the bootstrap secret and workflow from the source repo.\n\nThe initial baseline is 3 states, 5 QI candidates and 3 cost-seg candidates. Raw evidence records and normalized output are both version controlled. Pipeline normalization is deterministic; no live extraction is implemented.\n\n## Cloudflare Pages\n1. Connect the new repository in Cloudflare Pages with production branch main.\n2. Root directory: site. Framework: Astro. Build command: npm ci && npm run check && npm run build. Output: dist. Node version: 20 (NODE_VERSION=20).\n3. Set PUBLIC_SITE_URL to the final canonical HTTPS URL in Pages AND the GitHub repository Actions variable. The Actions fallback URL is only for verification, not an assertion of a deployment.\n4. Leave build watch paths inclusive of data/**, site/** and pipeline/** so data-only commits can trigger Pages builds. Pages Functions live in site/functions and are deployed alongside the static output.\n5. Check Pages deployment logs for every production build. GitHub CI verifies separately; linking Pages does not automatically make GitHub checks a production gate. Use preview-only integration and a manual production promotion or required checks before merging to main when a hard gate is needed.\n\n## Intake activation\nIntake fails closed unless configured. In Pages bind a private KV namespace as LEADS. Set secret TURNSTILE_SECRET_KEY and environment PRIVACY_CONTACT. Set public build variables PUBLIC_TURNSTILE_SITE_KEY and PUBLIC_PRIVACY_CONTACT to the matching site key and operator identity/deletion contact. Configure Turnstile to allow the actual production hostname. Disable intake in previews unless each preview hostname and private preview storage are deliberately configured. Never expose the secret as a PUBLIC variable.\n\nRequests are saved with a 30-day TTL. View/manage through authenticated Cloudflare administration; this starter includes no public lead-list API, email sending or provider forwarding. Confirmation states only that a request was saved. Provider outreach requires later authorization.\n\n## GitHub Actions\n- data-pipeline.yml: manual or Monday 03:17 UTC; Python 3.11; validate and normalize raw records; stage only data/normalized; commit to main when changed.\n- site-ci.yml: pushes/PRs/manual plus completed normalization runs; Node 20; npm ci, contract parity, calculator tests, npm run check, npm run build.\n- GITHUB_TOKEN bot commits do not trigger another push workflow; workflow_run performs site verification against main after normalization. Cloudflare external build triggering should be confirmed on the connected integration. Branch protection may require a narrowly scoped bot exception; do not silently bypass it.\n- schema contract fixtures compare required fields and representative accepted/rejected values. They are not a proof of equivalence for every possible JSON input.\n\n## Schema and data\nPydantic v2 schemas live in pipeline/models.py. Zod definitions live directly in site/src/content/config.ts and validate Astro data collections. A remote precheck/prebuild step copies normalized JSON into generated Astro collections; generated copies are ignored. Update both schemas together.\n\nProvider fee ranges use {minimum_usd, maximum_usd}, not a prose string. Rates are fractions (0.05 = 5%), null means variable/unknown. Nullable Boolean provider claims avoid falsely reporting an unknown as false. partner_tier is nullable because no contract exists. All seed providers have verified_partner=false or unassigned cost-seg tier. The supplied state field describes a baseline home-office state, not a regional coverage boundary. National/Regional filters are implemented.\n\n## Financial model\nInput excess depreciable basis must already exclude land. The model bounds it against purchase price minus land but does not compute basis from a sale. Carryover basis is excluded. Assumed short-life basis is 80% 5-year and 20% 15-year property with half-year MACRS. Remaining building basis uses 27.5/39-year mid-month depreciation. User-entered bonus rate defaults to 0; eligibility is not inferred. Results are deductions, not tax savings.\n\n## Known activation requirements\nRepository creation/commit, remote CI result, Cloudflare project connection, canonical URL and intake secrets cannot be claimed complete until their remote operations succeed. Astro 4 is retained as requested; evaluate its current support/security before production, remotely only. npm lockfile is generated and committed by bootstrap, never fabricated.\n"
